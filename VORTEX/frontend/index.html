<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VORTEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./css/rings.css" />
    <link rel="stylesheet" href="./css/controls.css" />
  </head>
  <body class="theme-dark">
    <div class="app">
      <main class="game">
        <div class="demo-tab hidden" id="demoTab">LIVE <button type="button" id="demoClose" aria-label="Close">×</button></div>

        <div class="game-top">
          <div class="game-top-left">
            <button type="button" class="gundu-back" id="gunduBackBtn" aria-label="Back to Casino">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="theme-toggle" role="group" aria-label="Theme">
              <button type="button" class="theme-opt" id="themeLightBtn" data-theme="light" aria-pressed="false">Light</button>
              <button type="button" class="theme-opt" id="themeDarkBtn" data-theme="dark" aria-pressed="true">Dark</button>
            </div>
          </div>
          <div class="game-name">VORTEX</div>
          <div class="game-top-right">
            <div class="game-balance">₹ <b id="gameBalance">0</b></div>
            <button type="button" class="deposit-btn" id="depositBtn" aria-label="Add money">+</button>
          </div>
        </div>

        <div class="board-wrap">
          <div class="board-stage">
            <canvas id="board" width="720" height="720"></canvas>
            <div class="core has-symbol fire-glow" id="core" aria-label="Symbol reel"></div>
          </div>
        </div>

        <div class="controls">
          <div class="ctrl-side">
            <button class="round-btn cashout" id="cashoutBtn" type="button" disabled>CASH<br />OUT</button>
            <small>Payout ₹<span id="payoutValue">0</span></small>
          </div>
          <div class="ctrl-center">
            <div class="bet-label">Bet Amount <span class="info">i</span></div>
            <div class="bet-row">
              <button class="round-btn small" id="betMinus" type="button">−</button>
              <div class="bet-amount">₹<span id="betValue">10</span></div>
              <button class="round-btn small" id="betPlus" type="button">+</button>
            </div>
            <button class="spin-btn" id="spinBtn" type="button" aria-label="Spin">
              <img class="spin-vortex" src="images/spin-button.png" alt="" draggable="false" />
            </button>
            <button class="auto-btn" id="autoBtn" type="button">AUTO</button>
          </div>
          <div class="ctrl-side">
            <button class="round-btn part" id="partBtn" type="button" disabled><span class="part-ico">↻<i>1/2</i></span></button>
            <small>Part Payout <span id="partValue">-</span></small>
          </div>
        </div>


      </main>

      <section class="howto" id="howto">
        <button class="howto-x" id="howtoClose" type="button">✕</button>
        <h2>HOW TO PLAY?</h2>
        <div class="howto-brand">
          <div class="howto-orb"></div>
          <div class="vip-badge">VIP</div>
          <p>4RAVORTEX 2</p>
        </div>
        <ul class="howto-list">
          <li>
            <div class="ht-art rings"></div>
            <p>Fill the rings, unlock Bonus Rounds, and win up to x999</p>
          </li>
          <li>
            <p>Cash Out anytime or use Part Payout</p>
            <div class="ht-art cash"><span>CASH OUT</span><span class="half">↻<i>1/2</i></span></div>
          </li>
          <li>
            <div class="ht-art toks"><i class="t fire">2X</i><i class="t earth">2X</i><i class="t water">2X</i></div>
            <p>Let x2 symbols fill two sectors at once</p>
          </li>
        </ul>
        <p class="howto-cta">PRESS ANYWHERE TO CONTINUE</p>
      </section>

      <div class="toast" id="toast"></div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
