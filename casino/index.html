<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gundu_casino_theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var w = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0);
        var desktop = w >= 768;
        document.documentElement.classList.toggle("is-desktop", desktop);
        document.documentElement.classList.toggle("is-wide", w >= 1200);
        document.documentElement.dataset.lobby = "d8-20260828desktop-a";
      })();
    </script>
    <link rel="stylesheet" href="./lobby-20260818g.css?v=20260828desktopA" />
  </head>
  <body>
    <div class="app">
      <aside class="desktop-sidebar" aria-label="Desktop navigation">
        <a class="sidebar-brand" href="/casino/">
          GUNDU <em>ATA</em>
        </a>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Game categories"></nav>
        <div class="sidebar-refer">
          <div class="sidebar-refer-art" aria-hidden="true">🎁</div>
          <div class="sidebar-refer-copy">
            <strong>Refer &amp; Earn</strong>
            <span>Invite friends. Get rewards.</span>
          </div>
          <a class="sidebar-refer-btn" href="/profile" id="referInviteBtn">Invite Now</a>
        </div>
        <div class="sidebar-foot">
          <a href="/support" title="Support">Support</a>
          <a href="/promotions" title="Promotions">Promos</a>
          <a href="/vip" title="VIP Club">VIP</a>
        </div>
      </aside>

      <header class="topbar">
        <button type="button" class="icon-btn back" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M15.5 4.5 8 12l7.5 7.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="mobile-title">Casino</h1>
        <a class="brand" href="/casino/">
          <svg class="brand-flame" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M12 2s3 3.4 3 7.2c0 1.8-.7 3.2-1.7 4.2.9-.3 1.7-1 2.2-2 1.6 2.2 1.5 5.4-.4 7.2C13.6 20.1 12 21 12 21s-1.6-.9-3.1-2.4c-1.9-1.8-2-5-.4-7.2.5 1 1.3 1.7 2.2 2-1-1-1.7-2.4-1.7-4.2C9 5.4 12 2 12 2z"
              fill="currentColor"
            />
          </svg>
          <span>Gundu <em>Casino</em></span>
        </a>
        <nav class="top-nav" id="desktopNavList" aria-label="Game categories"></nav>
        <div class="desktop-header-actions" id="desktopHeaderActions">
          <div class="wallet-chip" id="walletChip" hidden>
            <span class="wallet-coin" aria-hidden="true">₹</span>
            <span class="wallet-amount" id="walletAmount">0.00</span>
          </div>
          <a class="deposit-btn" id="depositBtn" href="/deposit">+ Deposit</a>
          <button type="button" class="theme-toggle desktop-theme" data-theme-toggle aria-label="Toggle theme">☀️</button>
          <a class="user-chip" id="userChip" href="/login">
            <span class="user-avatar" id="userAvatar" aria-hidden="true">G</span>
            <span class="user-meta">
              <strong id="userName">Guest</strong>
              <em id="userSub">Login</em>
            </span>
          </a>
        </div>
        <button type="button" class="theme-toggle mobile-theme" data-theme-toggle aria-label="Toggle theme">☀️</button>
        <a class="play-chip" id="topPlayBtn" href="/login">Login</a>
      </header>

      <main class="lobby" id="lobby" aria-label="Casino lobby">
        <section class="banners" aria-label="Featured">
          <button type="button" class="banner-arrow prev" id="bannerPrev" aria-label="Previous banner">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="banner-track" id="bannerTrack"></div>
          <button type="button" class="banner-arrow next" id="bannerNext" aria-label="Next banner">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="banner-dots" id="bannerDots"></div>
        </section>

        <section class="lobby-section" id="continueSection" hidden>
          <div class="section-head">
            <h2>Continue Playing</h2>
            <div class="section-head-right">
              <button type="button" class="view-all" data-rail="continueRail">See All</button>
              <div class="rail-nav" data-rail="continueRail"></div>
            </div>
          </div>
          <div class="rail-wrap">
            <div class="rail" id="continueRail"></div>
          </div>
        </section>

        <section class="lobby-section" id="popularSection">
          <div class="section-head">
            <h2>Popular</h2>
            <div class="section-head-right">
              <button type="button" class="view-all" data-rail="popularRail">View All</button>
              <div class="rail-nav" data-rail="popularRail"></div>
            </div>
          </div>
          <div class="rail-wrap">
            <div class="rail" id="popularRail"></div>
          </div>
        </section>

        <div id="categorySections"></div>

        <section class="lobby-section" id="allSection">
          <div class="section-head">
            <h2 id="allGamesTitle">All Games</h2>
            <div class="rail-nav" data-rail="allRail"></div>
          </div>
          <div class="rail-wrap">
            <div class="rail" id="allRail"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="./theme.js?v=1"></script>
    <script type="module" src="./lobby-20260818g.js?v=20260828desktopA"></script>
  </body>
</html>
