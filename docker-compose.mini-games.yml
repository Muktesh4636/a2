    restart: unless-stopped

  air_balloon_api:
    build: ./Air_ballon_pump/backend
    container_name: gundu_air_balloon_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8109:8000"]
    volumes:
      - ./Air_ballon_pump/backend:/app
      - air_balloon_data:/app/data
    restart: unless-stopped

volumes:
  mines_data:
  steps_data:
  boxes_data:
  snake_data:
  slide_data:
  cases_data:
  drop_data:
  plinko_data:
  air_balloon_data:
