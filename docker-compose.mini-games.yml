# Mini-games backends (Mines family + Plinko API + Air Balloon).
# Run on an app server alongside the main stack:
#   docker compose -f docker-compose.mini-games.yml up -d --build
#
# Frontends are static files on the LB under /mines/, /plinko/, etc.
# Nginx proxies /api/<game>/ → these containers.

services:
  mines_api:
    build: ./Mines/mines/backend
    container_name: gundu_mines_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8101:8000"]
    volumes:
      - ./Mines/mines/backend:/app
      - mines_data:/app/data
    restart: unless-stopped

  steps_api:
    build: ./Mines/steps/backend
    container_name: gundu_steps_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8102:8000"]
    volumes:
      - ./Mines/steps/backend:/app
      - steps_data:/app/data
    restart: unless-stopped

  boxes_api:
