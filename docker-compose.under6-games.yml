# under_6 card-game backends (rushbet, knock6, … teenpatti).
# under-6 itself already runs as gundu_under6_api on :8111.
#   docker compose -f docker-compose.under6-games.yml up -d --build

services:
  rushbet_api:
    build: ./under_6/games/rushbet/backend
    container_name: gundu_rushbet_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8140:8000"]
    volumes:
      - ./under_6/games/rushbet/backend:/app
      - rushbet_data:/app/data
    restart: unless-stopped

  knock6_api:
    build: ./under_6/games/knock6/backend
    container_name: gundu_knock6_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8141:8000"]
    volumes:
      - ./under_6/games/knock6/backend:/app
      - knock6_data:/app/data
    restart: unless-stopped

  tripleedge_api:
    build: ./under_6/games/tripleedge/backend
    container_name: gundu_tripleedge_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8142:8000"]
    volumes:
      - ./under_6/games/tripleedge/backend:/app
      - tripleedge_data:/app/data
    restart: unless-stopped

  mirror_api:
