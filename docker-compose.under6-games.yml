    container_name: gundu_mirror_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8143:8000"]
    volumes:
      - ./under_6/games/mirror/backend:/app
      - mirror_data:/app/data
    restart: unless-stopped

  goldlane_api:
    build: ./under_6/games/goldlane/backend
    container_name: gundu_goldlane_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8144:8000"]
    volumes:
      - ./under_6/games/goldlane/backend:/app
      - goldlane_data:/app/data
    restart: unless-stopped

  dead7_api:
    build: ./under_6/games/dead7/backend
    container_name: gundu_dead7_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8145:8000"]
    volumes:
      - ./under_6/games/dead7/backend:/app
      - dead7_data:/app/data
    restart: unless-stopped

  teenpatti_api:
    build: ./under_6/games/teenpatti/backend
    container_name: gundu_teenpatti_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8146:8000"]
    volumes:
      - ./under_6/games/teenpatti/backend:/app
      - teenpatti_data:/app/data
    restart: unless-stopped

volumes:
  rushbet_data:
  knock6_data:
  tripleedge_data:
  mirror_data:
  goldlane_data:
  dead7_data:
  teenpatti_data:
