<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 66" fill="none">
  <!-- Classic Aviator / Spribe-style red plane (nose right, slight climb) -->
  <g transform="rotate(-12 70 33)">
    <!-- main wing -->
    <path
      fill="#e61e26"
      d="M28 38c8-1 22-8 34-10 6-1 18-1 26 2 3 1 4 3 2 5-6 5-18 8-30 9-10 1-22 1-30-1-3-1-4-3-2-5z"
    />
    <!-- fuselage -->
    <path
      fill="#e61e26"
      d="M18 30c2-6 10-12 22-14 14-2 32-1 44 4 4 2 12 5 16 8 2 1 2 3 0 4-5 3-14 4-22 4H42c-10 0-18-1-22-3-3-1-4-2-2-3z"
    />
    <!-- cockpit bump -->
    <ellipse cx="62" cy="22" rx="10" ry="5.5" fill="#c41820" />
    <ellipse cx="62" cy="21.5" rx="7" ry="3.2" fill="#e61e26" />
    <!-- tail fin -->
    <path fill="#e61e26" d="M20 28l-12-14c-1-1 0-2 2-2l14 6c3 1 4 3 3 5l-3 5c-1 1-3 1-4 0z" />
    <path fill="#c41820" d="M22 30l-8 8c-1 1-3 1-4 0l2-10c1-2 3-2 5-1l5 3z" />
    <!-- X mark -->
    <path
      stroke="#8f1218"
      stroke-width="2.4"
      stroke-linecap="round"
      d="M48 26l12 10M60 26L48 36"
    />
    <!-- chevrons -->
    <path
      stroke="#8f1218"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      d="M36 30l3 3-3 3M41 30l3 3-3 3"
    />
    <!-- nose spinner -->
    <circle cx="102" cy="30" r="4.2" fill="#c41820" />
    <circle cx="102" cy="30" r="2.2" fill="#8f1218" />
    <!-- propeller -->
    <g fill="#e61e26">
      <path d="M102 30c1-10 4-16 7-18 1 0 2 1 1 3-3 5-5 10-6 15h-2z" />
      <path d="M102 30c-1 10-4 16-7 18-1 0-2-1-1-3 3-5 5-10 6-15h2z" />
      <path d="M102 30c10 1 16 4 18 7 0 1-1 2-3 1-5-3-10-5-15-6v-2z" />
      <path d="M102 30c-10-1-16-4-18-7 0-1 1-2 3-1 5 3 10 5 15 6v2z" />
    </g>
  </g>
</svg>
