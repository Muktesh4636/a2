<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <defs>
    <linearGradient id="hullMain" x1="20" y1="20" x2="180" y2="80">
      <stop offset="0%" stop-color="#4b7c8e"/>
      <stop offset="35%" stop-color="#2f5f72"/>
      <stop offset="70%" stop-color="#1a4454"/>
      <stop offset="100%" stop-color="#0f3040"/>
    </linearGradient>
    <linearGradient id="hullShine" x1="40" y1="18" x2="40" y2="70">
      <stop offset="0%" stop-color="#9fd4e6" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#9fd4e6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="portGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e0fbff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- propeller turbulence -->
  <ellipse cx="22" cy="52" rx="16" ry="14" fill="#67e8f9" opacity="0.12"/>
  <ellipse cx="14" cy="52" rx="10" ry="9" fill="#a5f3fc" opacity="0.16"/>

  <!-- wake bubbles -->
  <circle cx="8" cy="44" r="3.2" fill="#ecfeff" opacity="0.45"/>
  <circle cx="16" cy="38" r="2.2" fill="#a5f3fc" opacity="0.5"/>
  <circle cx="10" cy="58" r="2.6" fill="#ecfeff" opacity="0.35"/>
  <circle cx="20" cy="62" r="1.8" fill="#67e8f9" opacity="0.4"/>

  <!-- main pressure hull -->
  <ellipse cx="104" cy="52" rx="72" ry="28" fill="url(#hullMain)"/>
  <ellipse cx="104" cy="52" rx="72" ry="28" fill="url(#hullShine)"/>

  <!-- keel shadow -->
  <ellipse cx="104" cy="68" rx="58" ry="8" fill="#041820" opacity="0.35"/>

  <!-- deck ridge -->
  <path d="M52 40 Q104 28 156 40 L150 46 Q104 36 58 46 Z" fill="#0c2f3d" opacity="0.85"/>

  <!-- conning tower -->
  <path d="M88 22 h36 a6 6 0 0 1 6 6 v18 H82 V28 a6 6 0 0 1 6-6 Z" fill="#163d4d"/>
  <path d="M90 24 h28 a3 3 0 0 1 3 3 v4 H87 V27 a3 3 0 0 1 3-3 Z" fill="#2a6578"/>
  <!-- periscope -->
  <rect x="98" y="8" width="4" height="16" rx="1" fill="#1e4d5c"/>
  <rect x="98" y="6" width="14" height="3.5" rx="1" fill="#67e8f9" filter="url(#softGlow)"/>
  <!-- antenna -->
  <rect x="112" y="12" width="2" height="12" fill="#94a3b8"/>

  <!-- rivet line -->
  <g fill="#67e8f9" opacity="0.35">
    <circle cx="60" cy="52" r="1.1"/><circle cx="74" cy="52" r="1.1"/>
    <circle cx="88" cy="52" r="1.1"/><circle cx="116" cy="52" r="1.1"/>
    <circle cx="130" cy="52" r="1.1"/><circle cx="144" cy="52" r="1.1"/>
  </g>

  <!-- portholes -->
  <circle cx="138" cy="50" r="9" fill="#062636" stroke="#7dd3fc" stroke-width="1.6"/>
  <circle cx="138" cy="50" r="6.5" fill="url(#portGlow)" filter="url(#softGlow)"/>
  <circle cx="116" cy="52" r="5.5" fill="#062636" stroke="#5eead4" stroke-width="1.2"/>
  <circle cx="116" cy="52" r="3.5" fill="#67e8f9" opacity="0.55"/>
  <circle cx="96" cy="52" r="5.5" fill="#062636" stroke="#5eead4" stroke-width="1.2"/>
  <circle cx="96" cy="52" r="3.5" fill="#22d3ee" opacity="0.5"/>

  <!-- nose dome -->
  <path d="M168 36 Q196 52 168 68 Z" fill="#1a5566"/>
  <path d="M170 40 Q188 52 170 64 Z" fill="#67e8f9" opacity="0.35"/>

  <!-- stern fins -->
  <path d="M42 34 L24 12 L52 36 Z" fill="#0f3a48"/>
  <path d="M42 70 L24 90 L52 68 Z" fill="#0f3a48"/>
  <path d="M36 40 L18 52 L36 64 Z" fill="#145566"/>

  <!-- propeller -->
  <g transform="translate(28,52)">
    <ellipse cx="0" cy="0" rx="3" ry="11" fill="#94a3b8" opacity="0.85" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="3" ry="11" fill="#64748b" opacity="0.8" transform="rotate(-35)"/>
    <circle cx="0" cy="0" r="3.5" fill="#e2e8f0"/>
    <circle cx="0" cy="0" r="1.6" fill="#0ea5e9"/>
  </g>
</svg>
