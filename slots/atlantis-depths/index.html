<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Atlantis Depths</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <h1 class="logo">ATLANTIS<span>DEPTHS</span></h1>
      <section class="stage">
        <div class="pearl-meter">
          <span>PEARLS</span>
          <div class="meter-track"><div class="meter-fill" id="pearlFill"></div></div>
          <strong id="pearlCount">0/8</strong>
        </div>
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
        <div class="fs-badge hidden" id="fsBadge">FREE SPINS <span id="fsCount">0</span></div>
      </section>
      <footer class="hud">
        <div class="panel"><span>BALANCE</span><strong id="balance">10245.00</strong></div>
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">2.50</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <button type="button" id="spinBtn" class="spin"><span>SPIN</span></button>
        <div class="panel bubble"><span>WIN</span><strong id="lastWin">0.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">5×4 · MERMAID EXPANDS · 8 PEARLS = FREE SPINS</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
