<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dragon Sakura</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <h1 class="logo">DRAGON <span>SAKURA</span></h1>
      <section class="stage">
        <div class="petal-hud">PETALS <strong id="petalCount">0</strong></div>
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
        <div class="fs-badge hidden" id="fsBadge">DRAGON SPINS <span id="fsCount">0</span></div>
      </section>
      <footer class="hud">
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">2.00</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <button type="button" id="spinBtn" class="spin"><span>SPIN</span></button>
        <div class="panel"><span>WIN</span><strong id="lastWin">0.00</strong></div>
        <div class="panel"><span>BALANCE</span><strong id="balance">2000.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">DRAGON = WILD · SAKURA PETALS STICK · 3 DRAGONS = FREE SPINS</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
