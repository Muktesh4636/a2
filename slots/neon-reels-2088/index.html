<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Reels 2088</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <header class="top">
        <div class="jackpot mega">MEGA JACKPOT<strong id="mega">10088.88</strong></div>
        <h1 class="logo">NEON REELS 2088</h1>
        <div class="jackpot mini">MINI JACKPOT<strong id="mini">208.88</strong></div>
      </header>

      <section class="stage">
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
        <div class="bonus-overlay hidden" id="bonusOverlay">
          <h2>HACK PROTOCOL</h2>
          <p>Pick 3 neon chips</p>
          <div class="chips" id="hackChips"></div>
          <p class="bonus-total">BONUS <strong id="bonusTotal">0</strong></p>
        </div>
      </section>

      <footer class="hud">
        <div class="panel"><span>CREDITS</span><strong id="balance">12345.67</strong></div>
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">1.00</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <button type="button" id="spinBtn" class="spin">SPIN</button>
        <div class="panel"><span>WIN</span><strong id="lastWin">0.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">20 LINES · CHIP SCATTER = HACK BONUS · 7s HIT MINI · BOTS HIT MEGA</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
