<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inferno Peak</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <h1 class="logo">INFERNO<span>PEAK</span></h1>
      <section class="stage">
        <div class="fire-meter">
          <span>LAVA</span>
          <strong id="fireMult">×1</strong>
          <div class="fire-bar"><div class="fire-fill" id="fireFill"></div></div>
        </div>
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
      </section>
      <footer class="hud">
        <div class="panel"><span>BALANCE</span><strong id="balance">5000.00</strong></div>
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">2.50</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <button type="button" id="spinBtn" class="spin"><span>SPIN</span></button>
        <div class="panel"><span>WIN</span><strong id="lastWin">0.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">5×4 · 20 LINES · LAVA CASCADE · FIRE MULT RISES EACH TUMBLE · PHOENIX IS WILD</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
