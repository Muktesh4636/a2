<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Thunder of Asgard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <h1 class="logo"><span>THUNDER</span><em>OF</em><span class="asgard">ASGARD</span></h1>
      <section class="stage">
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
        <div class="strike-flash hidden" id="strikeFlash">LIGHTNING WILDS!</div>
      </section>
      <footer class="hud">
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">2.50</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <div class="panel"><span>BALANCE</span><strong id="balance">1250.00</strong></div>
        <button type="button" id="spinBtn" class="spin"><span>SPIN</span></button>
        <div class="panel"><span>WIN</span><strong id="lastWin">0.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">20 LINES · HAMMER = WILD · LIGHTNING STRIKES ADD WILDS</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
