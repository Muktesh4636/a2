<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Clockwork Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="game">
      <h1 class="logo">CLOCKWORK FORTUNE</h1>
      <section class="stage">
        <div class="reel-shell">
          <div class="reels" id="reels"></div>
        </div>
        <div class="win-banner hidden" id="winBanner">WIN <span id="winAmount">0</span></div>
        <div class="lock-flash hidden" id="lockFlash">GEAR LOCK RESPIN!</div>
      </section>
      <footer class="hud">
        <div class="panel bet-panel">
          <button type="button" id="betMinus" class="adj">−</button>
          <div><span>BET</span><strong id="bet">1.50</strong></div>
          <button type="button" id="betPlus" class="adj">+</button>
        </div>
        <div class="gauge-panel">
          <span>PRESSURE</span>
          <div class="gauge"><div class="needle" id="needle"></div></div>
          <strong id="lastWin">0.00</strong>
        </div>
        <button type="button" id="spinBtn" class="spin"><span>SPIN</span></button>
        <div class="panel"><span>BALANCE</span><strong id="balance">1750.00</strong></div>
        <button type="button" id="autoBtn" class="auto">AUTO</button>
      </footer>
      <p class="hint">GEARS LOCK &amp; RESPIN · WATCH = WILD · HIGH PRESSURE BURSTS BONUS</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
