<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Grow More</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=74" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand">
        <span class="logo">GROW<span>MORE</span></span>
        <span class="playing-count"><strong id="playingNum">1,240</strong> playing</span>
      </div>
      <div class="top-right">
        <div class="wallet">
          <span>₹</span>
          <strong id="balance">10000.00</strong>
        </div>
        <button class="deposit" id="deposit" aria-label="Add funds">+</button>
      </div>
    </header>

    <div class="chart-area">
      <div class="cashed-out" id="cashedOut">
        <div class="co-title">CASHED OUT</div>
        <div class="co-list" id="cashedOutList"></div>
      </div>

      <div class="live-badge" id="liveBadge" hidden>
        <span id="liveArrow">▼</span>
        <strong id="livePct">0%</strong>
      </div>

      <canvas id="chart"></canvas>

      <div class="zone-labels" aria-hidden="true">
        <span class="zone-up">▲ UP</span>
        <span class="zone-down">▼ DOWN</span>
      </div>

      <div class="host-pip" id="hostPip">
        <div class="host-video">
          <canvas class="host-face host-face-still" id="hostFace" width="360" height="440" aria-hidden="true" hidden></canvas>
          <video class="host-face" id="hostClip" playsinline muted autoplay></video>
        </div>
        <span class="live-tag">LIVE</span>
        <button type="button" class="host-voice-btn" id="hostVoiceBtn" aria-label="Mute host" title="Sound">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 9v6h3.5L12 19.5V4.5L7.5 9H4zm11.5 3c0-1.8-1-3.4-2.5-4.2v8.4c1.5-.8 2.5-2.4 2.5-4.2zm2.5 0c0 2.9-1.6 5.4-4 6.7v2.2c3.5-1.4 6-4.8 6-8.9s-2.5-7.5-6-8.9v2.2c2.4 1.3 4 3.8 4 6.7z"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M16.5 12c0-1.8-1-3.4-2.5-4.2v2.4l2.4 2.4c.06-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5C20.6 15.1 21 13.6 21 12c0-4.1-2.5-7.5-6-8.9v2.2c2.4 1.3 4 3.8 4 6.7zM4.3 3 3 4.3 7.7 9H4v6h3.5L12 19.5v-6.2l4.2 4.2c-.7.5-1.4.9-2.2 1.2v2.2c1.4-.3 2.6-1 3.7-1.8L19.7 21 21 19.7 4.3 3zM12 4.5v4.7L9.8 7.05 12 4.5z"/>
          </svg>
        </button>
      </div>

      <div class="bets-banner" id="betsBanner">
        PLACE YOUR BETS <span id="timerNum">7</span>
      </div>

      <div class="result-flash" id="resultFlash" hidden></div>
    </div>

    <div class="mini-wrap">
      <canvas id="miniChart"></canvas>
    </div>

    <div class="sentiment" id="sentiment">
      <!-- Green UP half -->
      <div class="sent-half sent-half-up">
        <canvas id="liquidUp" class="liquid-canvas"></canvas>
        <strong class="sent-pct" id="upPctLabel">50%</strong>
        <div class="sent-info">
          <span class="sent-amt" id="upAmount">₹ 18,674</span>
          <span class="sent-players"><span class="sent-person">👤</span><span id="upPlayers">46</span></span>
        </div>
      </div>
      <!-- Red DOWN half -->
      <div class="sent-half sent-half-down">
        <canvas id="liquidDown" class="liquid-canvas"></canvas>
        <div class="sent-info sent-info-right">
          <span class="sent-amt" id="downAmount">₹ 18,860</span>
          <span class="sent-players"><span class="sent-person">👤</span><span id="downPlayers">32</span></span>
        </div>
        <strong class="sent-pct" id="downPctLabel">50%</strong>
      </div>
      <!-- Progress bar at bottom -->
      <div class="sent-fill">
        <div class="sent-fill-up" id="sentFillUp" style="width:50%"></div>
      </div>
    </div>

    <div class="bottom-dock">
      <div class="portfolio-row">
        <div class="portfolio-box">
          <span>PORTFOLIO</span>
          <strong>₹<em id="portfolioValue">0.00</em></strong>
          <small>3% FEE</small>
        </div>
        <button class="cashout" id="cashOutBtn" disabled>CASH OUT</button>
      </div>

      <div class="sides">
        <button class="side up" id="betUp">
          <span class="chip-side left" id="chipSlotUp" aria-hidden="true"></span>
          <span class="side-label">UP</span>
          <span class="tri">▲</span>
        </button>
        <button class="side down" id="betDown">
          <span class="side-label">DOWN</span>
          <span class="tri">▼</span>
          <span class="chip-side right" id="chipSlotDown" aria-hidden="true"></span>
        </button>
      </div>

      <div class="tools">
        <div class="tool-group tool-group-left">
          <span class="tool-label">UNDO</span>
          <button class="tool fab" id="undoBtn" title="Undo" aria-label="Undo">↺</button>
        </div>

        <div class="chip-stack" id="chipStack" aria-label="Select chip" aria-expanded="false">
          <button type="button" class="chip active" data-amt="10" data-chip="10" aria-label="Chip 10">10</button>
          <button type="button" class="chip" data-amt="20" data-chip="20" aria-label="Chip 20">20</button>
          <button type="button" class="chip" data-amt="50" data-chip="50" aria-label="Chip 50">50</button>
          <button type="button" class="chip" data-amt="100" data-chip="100" aria-label="Chip 100">100</button>
          <button type="button" class="chip" data-amt="500" data-chip="500" aria-label="Chip 500">500</button>
          <button type="button" class="chip" data-amt="1000" data-chip="1000" aria-label="Chip 1000">1K</button>
        </div>
        <span id="stakeDisplay" class="sr-only">10</span>

        <div class="tool-group tool-group-right">
          <button class="tool fab fab-double" id="doubleBtn" title="Double" aria-label="Double">×2</button>
          <span class="tool-label">DOUBLE</span>
          <button class="tool menu" id="menuBtn" title="Menu" aria-label="Menu">☰</button>
        </div>
      </div>

      <div class="bet-footer">
        <div class="footer-left">
          <div class="footer-line">Total Bet <strong id="totalBet">₹0</strong></div>
          <div class="footer-line">Balance <strong id="footerBalance">₹0.00</strong></div>
        </div>
        <div class="footer-right">
          <span class="footer-limits">Grow More <strong>₹10 – 1,000</strong></span>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="game.js?v=78"></script>
    <link rel="stylesheet" href="/casino/live-wins.css" />
    <script src="/casino/live-wins.js" defer></script>
</body>
</html>
