# DISABLED — Teen Patti no longer pulls external TvBet/4rabet streams.
# Game runs on Gundu /api/teenpatti only. Use deploy_teenpatti_live.sh for frontend deploy.
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: gundu_teenpatti_live_relay:local
    container_name: gundu_teenpatti_live_relay
    restart: unless-stopped
    environment:
      SOURCE_URL: ${SOURCE_URL:-https://cloudfront.cdn-flb.tvbet.bet/live/teenpatti/playlist.m3u8}
      REFERER: ${REFERER:-https://tvbetframe23.com/}
    volumes:
      - teenpatti_hls:/hls

  hls:
    image: nginx:1.27-alpine
    container_name: gundu_teenpatti_live_hls
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "8157:80"
    volumes:
      - teenpatti_hls:/usr/share/nginx/html/hls:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  teenpatti_hls:
