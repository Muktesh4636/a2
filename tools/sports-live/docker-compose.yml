# Radhe Exchange multi-sport live HLS relay → gunduata.tech/sports-live/{event_id}/stream.m3u8
services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: gundu_sports_live_relay:local
    container_name: gundu_sports_live_relay
    restart: unless-stopped
    environment:
      SPORTS_LIVE_RELAY_IP: ${SPORTS_LIVE_RELAY_IP:-72.61.254.71}
      POLL_SEC: ${POLL_SEC:-30}
      MAX_STREAMS: ${MAX_STREAMS:-24}
    volumes:
      - sports_hls:/hls

  hls:
    image: nginx:1.27-alpine
    container_name: gundu_sports_live_hls
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "8158:80"
    volumes:
      - sports_hls:/usr/share/nginx/html/hls:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sports_hls:
