    container_name: gundu_shark_bite_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8137:8000"]
    volumes:
      - ./Aviator/wave-surf/backend:/app
      - shark_bite_data:/app/data
    restart: unless-stopped

volumes:
  aviator_data:
  jet_data:
  maestro_data:
  deep_dive_data:
  sky_lift_data:
  paper_plane_data:
  ufo_lift_data:
  shark_bite_data:
