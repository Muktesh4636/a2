# Aviator crash-game backends.
#   docker compose -f docker-compose.aviator-games.yml up -d --build
#
# Frontends on LB under /aviator/, /jet/, … /shark-bite/
# Nginx: /api/<id>/ → these containers (strip → /api/)

services:
  aviator_api:
    build: ./Aviator/aviator/backend
    container_name: gundu_aviator_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8130:8000"]
    volumes:
      - ./Aviator/aviator/backend:/app
      - aviator_data:/app/data
    restart: unless-stopped

  jet_api:
    build: ./Aviator/jet/backend
    container_name: gundu_jet_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8131:8000"]
    volumes:
      - ./Aviator/jet/backend:/app
      - jet_data:/app/data
    restart: unless-stopped

  maestro_api:
