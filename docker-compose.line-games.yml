# Line games backends (circle / stop-bar / spin-dial / …).
#   docker compose -f docker-compose.line-games.yml up -d --build
#
# Frontends are static files on the LB under /circle-game/, /wave-surf/, etc.
# Nginx proxies /api/<game>/ → these containers (strip prefix → /api/).

services:
  circle_game_api:
    build: ./line/circle-game/backend
    container_name: gundu_circle_game_api
    command: bash -lc "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8120:8000"]
    volumes:
      - ./line/circle-game/backend:/app
      - circle_game_data:/app/data
    restart: unless-stopped

  stop_bar_api:
