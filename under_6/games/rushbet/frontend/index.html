<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUSH BET — Fast Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <div class="bank">
        <span class="bank-label">Bankroll</span>
        <span class="bank-value" id="bankroll">1000</span>
      </div>
      <div class="round" id="roundInfo">Place your bet</div>
    </header>

    <main class="stage">
      <section class="brand-block">
        <p class="brand">RUSH BET</p>
        <h1 class="tagline">Call it. Flip fast.</h1>
        <p class="lede">
          Lock Low or High before the cards drop. Two cards. One sum. No slow reveal.
        </p>
      </section>

      <section class="table" aria-label="Game table">
        <div class="table-scene" id="tableScene" data-camera="top">
          <canvas id="tableCanvas" class="table-canvas" aria-hidden="true"></canvas>

          <div class="play-surface" id="playSurface">
            <div class="cards" id="cards">
              <div class="card-slot" data-slot="1">
                <div class="card-shadow"></div>
                <div class="card-rig" id="rig1" data-state="hidden">
                  <div class="card" id="card1" data-face="down">
                    <div class="card-face card-back" aria-hidden="true">
                      <span class="back-mark">R</span>
                    </div>
                    <div class="card-face card-front">
                      <div class="corner top">
                        <span class="rank"></span>
                        <span class="suit"></span>
                      </div>
                      <span class="center-suit"></span>
                      <div class="corner bottom">
                        <span class="rank"></span>
                        <span class="suit"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card-slot" data-slot="2">
                <div class="card-shadow"></div>
                <div class="card-rig" id="rig2" data-state="hidden">
                  <div class="card" id="card2" data-face="down">
                    <div class="card-face card-back" aria-hidden="true">
                      <span class="back-mark">R</span>
                    </div>
                    <div class="card-face card-front">
                      <div class="corner top">
                        <span class="rank"></span>
                        <span class="suit"></span>
                      </div>
                      <span class="center-suit"></span>
                      <div class="corner bottom">
                        <span class="rank"></span>
                        <span class="suit"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="result-banner" id="resultBanner" hidden>
              <div class="sum-orb" id="sumOrb" aria-live="polite">
                <span class="sum-label">Sum</span>
                <span class="sum-value" id="sumValue">?</span>
              </div>
              <p class="outcome" id="outcome"></p>
            </div>
          </div>
        </div>

        <div class="bet-board rush-board" role="group" aria-label="Bet options">
          <button type="button" class="bet-lane low" data-side="low" id="betLow">
            <span class="lane-name">Low</span>
            <span class="lane-range">Sum 2–6</span>
            <span class="lane-odds">Pays 2×</span>
          </button>
          <button type="button" class="bet-lane high" data-side="high" id="betHigh">
            <span class="lane-name">High</span>
            <span class="lane-range">Sum 7–12</span>
            <span class="lane-odds">Pays 2×</span>
          </button>
        </div>

        <div class="controls">
          <div class="chips" role="group" aria-label="Chip amount">
            <button type="button" class="chip" data-amount="10">10</button>
            <button type="button" class="chip selected" data-amount="25">25</button>
            <button type="button" class="chip" data-amount="50">50</button>
            <button type="button" class="chip" data-amount="100">100</button>
          </div>
          <button type="button" class="deal-btn" id="dealBtn" disabled>Rush deal</button>
        </div>
      </section>

      <section class="rules">
        <h2>How it pays</h2>
        <ul>
          <li><strong>Low</strong> — sum is 2–6 · stake returns <em>2×</em></li>
          <li><strong>High</strong> — sum is 7–12 · stake returns <em>2×</em></li>
          <li>Cards flip fast — call before the rush.</li>
        </ul>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="table3d.js?v=1"></script>
    <script src="sounds.js?v=1"></script>
    <script src="game.js?v=10"></script>
  </body>
</html>
