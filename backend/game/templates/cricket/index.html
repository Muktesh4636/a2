<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CRICKET</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    /* APK WebView already pads below the status bar — avoid a second top gap */
    (function () {
      try {
        var t = localStorage.getItem('gundu_sports_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
      try {
        var ua = navigator.userAgent || '';
        var bridge = window.AndroidBridge;
        var inApp = /GunduAtaApp/i.test(ua) || !!(bridge && typeof bridge.isSystemBarsInsetApplied === 'function');
        if (inApp) {
          document.documentElement.classList.add('android-system-bars');
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('in-app', 'android-system-bars');
          });
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --elevated: #1c222e;
      --gold: #d4af37;
      --gold-bright: #ffd54f;
      --blue: #76c7ed;
      --pink: #e57373;
      --muted: #9aa3af;
      --border: #3a4556;
      --on-odd: #0a0a0a;
      --text: #ffffff;
      --safe-top: env(safe-area-inset-top, 0px);
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --card: #ffffff;
      --elevated: #f3f4f6;
      --gold: #0b8f4e;
      --gold-bright: #10b981;
      /* Odds boxes keep black-theme colours */
      --blue: #76c7ed;
      --pink: #e57373;
      --muted: #6b7280;
      --border: #e5e7eb;
      --on-odd: #0a0a0a;
      --text: #111827;
    }
    * { box-sizing: border-box; }
    html {
      margin: 0;
      background: var(--bg);
    }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body { padding-bottom: 76px; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
    body.no-bottom-nav { padding-bottom: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    body.no-bottom-nav .nav { display: none !important; }
    a { color: inherit; text-decoration: none; }

    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid rgba(58, 69, 86, 0.45);
    }
    html[data-theme="light"] .top {
      border-bottom-color: var(--border);
      box-shadow: 0 4px 14px rgba(17,24,39,.05);
    }
    /* Browser/notch only — APK WebView already pads below the status bar */
    body:not(.android-system-bars):not(.in-app) .top {
      padding-top: max(6px, var(--safe-top));
    }
    body.android-system-bars .top,
    body.in-app .top,
    html.android-system-bars .top {
      padding-top: 4px;
    }
    .brand-icon {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--gold);
      display: grid; place-items: center;
      font-size: 12px; color: #111; font-weight: 800;
    }
    html[data-theme="light"] .brand-icon { color: #fff; }
    .brand { color: var(--gold); font-weight: 800; letter-spacing: .06em; font-size: 18px; }
    .spacer { flex: 1; }
    .theme-toggle {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--elevated);
      color: var(--text); font-size: 15px; cursor: pointer;
      display: grid; place-items: center; margin-right: 4px;
    }
    .my-bets { color: var(--gold-bright); font-size: 13px; font-weight: 600; margin-right: 6px; }
    .wallet {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .plus {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--gold-bright); color: #111;
      display: grid; place-items: center; font-weight: 800; font-size: 18px;
      margin-left: 8px;
    }
    html[data-theme="light"] .plus { color: #fff; }

    .wrap { padding: 0 14px 20px; max-width: 480px; margin: 0 auto; }
    .tabs {
      display: flex; gap: 0; margin: 4px 0 14px;
      border-bottom: 1px solid var(--border);
    }
    .tabs button {
      flex: 1; background: none; border: 0; color: var(--muted);
      padding: 12px 8px 10px; font-size: 15px; font-weight: 600; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active { color: var(--gold); border-bottom-color: var(--gold); }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #2e7d32; margin-right: 6px; vertical-align: middle;
    }
    html[data-theme="light"] .dot { background: #0b8f4e; }

    .match-card, .market-card, .score-card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #2a3340;
    }
    .match-card { cursor: pointer; }
    .match-card h3 {
      margin: 0 0 6px; font-size: 16px; line-height: 1.3;
    }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700; margin-left: 8px;
      background: rgba(46,125,50,.18); color: #81c784;
    }
    .badge.up { background: rgba(84,110,122,.25); color: #b0bec5; }
    .badge.tv {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(26, 158, 158, 0.18); color: #4dd0e1;
      border: 1px solid rgba(77, 208, 225, 0.35);
      animation: tv-glow 1.6s ease-in-out infinite;
    }
    @keyframes tv-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(77, 208, 225, 0.35); }
      50% { box-shadow: 0 0 8px 2px rgba(77, 208, 225, 0.2); }
    }
    .odds-row { display: flex; gap: 8px; }
    .odd-btn {
      flex: 1; border: 0; border-radius: 8px; padding: 8px 8px;
      cursor: pointer; text-align: center; color: var(--on-odd);
      min-height: 0;
    }
    .odd-btn.blue { background: var(--blue); }
    .odd-btn.pink { background: var(--pink); }
    .odd-btn .name {
      font-size: 11px; font-weight: 600; line-height: 1.2;
      margin-bottom: 3px; max-height: 2.4em; overflow: hidden;
    }
    .odd-btn .price { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }

    .crumb { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
    .title {
      font-size: 17px; font-weight: 800; line-height: 1.25;
      text-transform: uppercase; margin: 0 0 10px;
    }
    .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .icon-btn, .pill {
      background: var(--elevated); border: 1px solid var(--border);
      color: var(--muted); border-radius: 10px; padding: 10px 12px; cursor: pointer;
      font-size: 13px; font-weight: 600;
    }
    .icon-btn.on { color: #1a9e9e; border-color: #1a9e9e; background: #132428; }
    .pill { border-radius: 20px; }
    .pill.on { color: var(--blue); border-color: var(--blue); background: #1a2836; }

    .live-tv-panel {
      margin-bottom: 14px; border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); background: #000;
    }
    .live-tv-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #1a9e9e; color: #fff;
      font-size: 12px; font-weight: 800; letter-spacing: .04em;
    }
    .live-tv-frame {
      width: 100%; aspect-ratio: 16 / 9; border: 0; display: block;
      background: #0a1628;
    }
    .live-tv-body {
      position: relative; background: #000; line-height: 0;
    }
    .live-tv-video {
      width: 100%; aspect-ratio: 16 / 9; display: block;
      background: #000; object-fit: cover;
    }
    .live-tv-mute {
      position: absolute; right: 10px; bottom: 10px; z-index: 2;
      width: 42px; height: 42px; border: 0; border-radius: 50%;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      font-size: 20px; line-height: 42px; text-align: center;
      cursor: pointer; padding: 0;
    }
    .live-tv-mute:active { background: rgba(0, 0, 0, 0.75); }
    .live-tv-video::-webkit-media-controls { display: none !important; }
    .live-tv-video::-webkit-media-controls-enclosure { display: none !important; }
    .live-tv-video::-webkit-media-controls-start-playback-button,
    .live-tv-video::-webkit-media-controls-overlay-play-button,
    .live-tv-video::-webkit-media-controls-play-button {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .live-tv-msg {
      padding: 28px 16px; text-align: center; color: var(--muted);
      font-size: 13px;
    }

    .score-card { padding: 0; overflow: hidden; }
    .score-head {
      background: rgba(118,199,237,.85); color: #0a1a24;
      font-weight: 700; font-size: 13px; padding: 8px 12px;
    }
    .score-body { padding: 12px 14px; }
    .score-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0; font-weight: 700; font-size: 15px;
    }
    .score-row .abbr { min-width: 28px; }
    .team-logo {
      width: 22px; height: 22px; border-radius: 50%; object-fit: contain;
      background: #0f141c; border: 1px solid #314055; flex: 0 0 auto;
    }
    .bat-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    }
    .score-row .score { margin-left: auto; }
    .score-foot { color: var(--muted); font-size: 12px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: 700; margin: 6px 0 8px; }
    .filters {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--border); background: transparent;
      color: var(--muted); border-radius: 8px; padding: 6px 10px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .chip.active { border-color: var(--blue); background: var(--elevated); color: var(--text); }
    .updated { color: var(--muted); font-size: 10px; margin: 6px 0 10px; }
    .market-card { padding: 11px !important; }
    .market-card h4 { margin: 0 0 2px; font-size: 13px; font-weight: 700; }
    .market-card .sub { color: var(--muted); font-size: 11px; margin-bottom: 8px; }

    .empty, .loading, .error {
      text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px;
    }
    .error { color: #ef9a9a; }
    html[data-theme="light"] .error { color: #b91c1c; }
    .back {
      background: none; border: 0; color: var(--gold); font-size: 20px;
      cursor: pointer; padding: 0 4px 0 0; line-height: 1;
    }

    .nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 64px; background: #12161d; border-top: 1px solid #2a3340;
      display: flex; align-items: center; justify-content: space-around;
      max-width: 480px; margin: 0 auto;
    }
    html[data-theme="light"] .nav {
      background: #ffffff; border-top-color: var(--border);
      box-shadow: 0 -4px 14px rgba(17,24,39,.06);
    }
    .nav a {
      color: var(--gold); font-size: 10px; font-weight: 700;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      opacity: .75;
    }
    .nav a.active { opacity: 1; }
    .nav .mid {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--gold); color: #111;
      display: grid; place-items: center; font-size: 18px;
      margin-top: -18px; box-shadow: 0 4px 12px rgba(212,175,55,.35);
    }
    html[data-theme="light"] .nav .mid {
      color: #fff; box-shadow: 0 4px 12px rgba(11,143,78,.35);
    }
    .toast {
      position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
      background: var(--elevated); border: 1px solid var(--border); padding: 10px 14px;
      border-radius: 10px; font-size: 13px; display: none; z-index: 50;
      max-width: 90%; color: var(--text);
    }
  </style>
</head>
<body>
  <header class="top">
    <button class="back" id="backBtn" style="display:none" aria-label="Back">←</button>
    <div class="brand-icon">🏏</div>
    <div class="brand">CRICKET</div>
    <div class="spacer"></div>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀️</button>
    <div class="my-bets" id="myBets">My bets</div>
    <div class="wallet" id="wallet">₹ —</div>
    <div class="plus" id="plusBtn" title="Add funds">+</div>
  </header>

  <main class="wrap" id="app">
    <div class="loading">Loading cricket…</div>
  </main>

  <nav class="nav" id="bottomNav">
    <a href="/sports/"><span>⌂</span><span>HOME</span></a>
    <a href="#"><span>🎁</span><span>PROMOTIONS</span></a>
    <a class="active" href="/cricket/"><span class="mid">🏏</span><span>CRICKET</span></a>
    <a href="/"><span>🎲</span><span>CASINO</span></a>
    <a href="/"><span>👤</span><span>PROFILE</span></a>
  </nav>
  <div class="toast" id="toast"></div>

  <script src="/sports/theme.js?v=1"></script>
  <script src="/sports/auth-wallet.js?v=6"></script>
  <script src="/sports/live-tv.js?v=2"></script>
  <script src="/sports/betslip.js?v=6"></script>
  <script>
    const app = document.getElementById('app');
    const backBtn = document.getElementById('backBtn');
    const toastEl = document.getElementById('toast');
    if (window.GunduSportsAuth) GunduSportsAuth.bootWallet('wallet');
    let listTab = 'live'; // live | pre
    let filter = 'all';
    let showScoreboard = true;
    let showLiveTv = false;
    let liveTvUserDismissed = true;
    let liveTvHls = null;
    let liveTvPlayer = null;
    let pollTimer = null;

    function radheEventIdFromQuery() {
      const p = qs();
      return p.get('radhe_event_id') || p.get('radhe_id') || '';
    }

    function stopLiveTv() {
      if (liveTvPlayer) { liveTvPlayer.destroy(); liveTvPlayer = null; }
      liveTvHls = null;
    }

    function isLiveTvPlaying() {
      return showLiveTv && (document.getElementById('liveTvVideo') || document.getElementById('liveTvFrame'));
    }

    function updateScoresOnly(d) {
      const foot = document.querySelector('.score-foot');
      if (foot) foot.textContent = d.current_innings || '';
      document.querySelectorAll('.score-row .score').forEach((el, i) => {
        const s = (d.scores || [])[i];
        if (s) el.textContent = s.score || '0-0';
      });
      const upd = document.querySelector('.updated');
      if (upd && (d.last_sync || d.updated)) upd.textContent = 'Updated ' + esc(d.last_sync || d.updated);
    }

    function refreshMarketBetTags(d) {
      if (!window.GunduBetslip) return;
      (d.all_markets || []).forEach(m => {
        const card = document.querySelector(`.market-card[data-market-id="${m.market_id}"]`);
        if (!card) return;
        const head = GunduBetslip.marketHeadHtml(m.market_name, m.market_id, m.outcomes || []);
        const oldHead = card.querySelector('.market-head, h4');
        if (oldHead) {
          const wrap = document.createElement('div');
          wrap.innerHTML = head;
          oldHead.replaceWith(wrap.firstElementChild || wrap);
        }
      });
    }

    function playLiveHls(src, embedUrl) {
      const video = document.getElementById('liveTvVideo');
      if (!video || !src) return;
      if (video.dataset.liveSrc === src && video.dataset.livePlayer === '1' && !video.paused) return;
      stopLiveTv();
      if (window.GunduLiveTv && GunduLiveTv.createPlayer) {
        liveTvPlayer = GunduLiveTv.createPlayer(video, src, {
          onFatal: () => {
            if (embedUrl) {
              stopLiveTv();
              const panel = document.getElementById('liveTvPanel');
              if (panel) {
                panel.innerHTML = `<iframe class="live-tv-frame" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade" src="${embedUrl}"></iframe>`;
              }
            }
          },
        });
        liveTvHls = liveTvPlayer.hls || null;
        if (!liveTvPlayer.hls) GunduLiveTv.wireSpeaker(video);
        return;
      }
      if (window.Hls && Hls.isSupported()) {
        liveTvHls = new Hls(window.GunduLiveTv && GunduLiveTv.hlsConfig ? GunduLiveTv.hlsConfig() : { liveSyncDuration: 6, maxLiveSyncPlaybackRate: 1.05 });
        liveTvHls.loadSource(src);
        liveTvHls.attachMedia(video);
        liveTvHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (window.GunduLiveTv) GunduLiveTv.wireSpeaker(video);
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        if (window.GunduLiveTv) GunduLiveTv.wireSpeaker(video);
        video.play().catch(() => {});
      }
    }

    async function loadLiveTv(matchName, competition, teamNames) {
      if (window.GunduLiveTv) {
        return GunduLiveTv.lookup({
          sport: 'cricket',
          matchName,
          competition,
          teamNames,
        });
      }
      const q = new URLSearchParams({ sport: 'cricket' });
      if (matchName) q.set('match_name', matchName);
      if (competition) q.set('competition', competition);
      q.set('in_play', '0');
      return getJson(`/api/sports/live-tv/lookup/?${q}`);
    }

    function liveTvFromApi(d) {
      const tv = d && d.live_tv;
      if (!tv) return null;
      const eid = tv.radhe_event_id || tv.event_id;
      const relay = tv.relay_hls_url || (eid ? `/sports-live/${eid}/stream.m3u8` : '');
      if (!relay && !tv.embed_url && !eid) return null;
      return {
        ok: true,
        event_id: eid,
        channel_id: tv.channel_id,
        embed_url: tv.embed_url,
        relay_hls_url: relay,
      };
    }

    function hasLiveTvInfo(info) {
      return !!(info && (info.relay_hls_url || info.embed_url || info.event_id || info.radhe_event_id));
    }

    function teamNamesFromDetail(d) {
      return (d.scores || []).map(s => s.team).filter(Boolean);
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.style.display = 'none', 2200);
    }

    function qs() {
      return new URLSearchParams(location.search);
    }
    function setQuery(params) {
      const u = new URL(location.href);
      Object.entries(params).forEach(([k, v]) => {
        if (v == null || v === '') u.searchParams.delete(k);
        else u.searchParams.set(k, v);
      });
      history.pushState({}, '', u);
    }

    function teamAbbr(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      if (parts.length === 1) return parts[0].slice(0, 3).toUpperCase();
      return parts.slice(0, 3).map(p => p[0].toUpperCase()).join('');
    }
    function teamLogoUrl(name) {
      return '/api/sports/team-logo/?' + new URLSearchParams({
        name: name || 'Team', sport: 'cricket', fallback: '1'
      }).toString();
    }

    function isOverByOver(q) {
      q = (q || '').toLowerCase();
      const keys = ['over by over','delivery of over','next ball','next over','ball by ball','this over','runs in over'];
      if (keys.some(k => q.includes(k))) return true;
      if (/\d+(st|nd|rd|th)?\s+delivery/.test(q)) return true;
      if (q.includes('total runs in') && (q.includes('delivery') || q.includes('over'))) return true;
      return false;
    }
    function isSpecial(q) {
      q = (q || '').toLowerCase();
      return ['special','fancy','player','top batsman','man of the match','most runs','most wickets','boundary','sixes','fours']
        .some(k => q.includes(k));
    }
    function filterMarkets(markets, tab) {
      return (markets || []).filter(m => {
        const q = `${m.market_name || ''} ${m.market_type || ''} ${m.period || ''}`;
        if (tab === 'all') return true;
        if (tab === 'over') return isOverByOver(q);
        if (tab === 'special') return isSpecial(q);
        return !isOverByOver(q) && !isSpecial(q); // main
      });
    }

    async function getJson(url) {
      const r = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error(`Failed (${r.status})`);
      return r.json();
    }

    function oddButtons(outcomes, ctx) {
      const outs = outcomes || [];
      ctx = ctx || {};
      if (!outs.length) return '<div class="meta">No odds</div>';
      return `<div class="odds-row">${outs.map((o, i) => `
        <button type="button" class="odd-btn ${i % 2 === 0 ? 'blue' : 'pink'}"
          data-event-id="${esc(ctx.eventId || '')}"
          data-event-name="${esc(ctx.eventName || '')}"
          data-market-id="${esc(o.market_id || ctx.marketId || '')}"
          data-market-name="${esc(ctx.marketName || '')}"
          data-outcome-id="${esc(o.outcome_id || '')}"
          data-name="${esc(o.name || o.team || '')}"
          data-price="${esc(o.price_format || '-')}">
          <div class="name">${esc(o.name || o.team || '')}</div>
          <div class="price">${esc(o.price_format || '-')}</div>
        </button>`).join('')}</div>`;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function hasLiveTv(tv) {
      return !!(tv && (tv.relay_hls_url || tv.embed_url || tv.radhe_event_id || tv.event_id));
    }
    function sortLiveTvFirst(events, hasTvFn) {
      return [...events].sort((a, b) => Number(hasTvFn(b)) - Number(hasTvFn(a)));
    }
    function tvBadgeHtml() {
      return '<span class="badge tv" title="Live TV running">📺 TV</span>';
    }
    async function enrichEventsLiveTv(events) {
      if (!window.GunduLiveTv || listTab !== 'live') return events;
      let streams;
      try { streams = await GunduLiveTv.fetchIndex(false); } catch { return events; }
      const filtered = streams.filter(s => s.sport === 'cricket');
      const TV_MATCH_THRESHOLD = 0.32;
      return events.map(e => {
        if (hasLiveTv(e.live_tv)) return e;
        const teams = (e.scores || []).map(s => s.team).filter(Boolean);
        const matchName = e.match_name || (teams.length >= 2 ? `${teams[0]} vs ${teams[1]}` : '');
        let best = null, bestScore = 0;
        for (const s of filtered) {
          const sc = GunduLiveTv.scoreEventStream
            ? GunduLiveTv.scoreEventStream(s, { matchName, competition: e.competition, teamNames: teams })
            : GunduLiveTv.pairScore(matchName, s.name);
          if (sc > bestScore) { bestScore = sc; best = s; }
        }
        if (best && bestScore >= TV_MATCH_THRESHOLD) {
          const tv = {
            ok: true,
            event_id: best.event_id,
            radhe_event_id: best.event_id,
            relay_hls_url: best.relay_hls_url,
            embed_url: best.embed_url,
          };
          e.live_tv = tv;
        }
        return e;
      });
    }

    function matchDetailQuery(eventId, tv, isPre) {
      const q = { view: 'match', event_id: eventId, pre: isPre ? '1' : '0' };
      if (tv && hasLiveTv(tv)) {
        q.has_tv = '1';
        const eid = tv.radhe_event_id || tv.event_id;
        if (eid) q.radhe_event_id = String(eid);
      }
      return q;
    }

    let listFeaturedTvPlayer = null;

    function stopListFeaturedTv() {
      if (listFeaturedTvPlayer) { listFeaturedTvPlayer.destroy(); listFeaturedTvPlayer = null; }
    }

    function mountListFeaturedLiveTv(events) {
      stopListFeaturedTv();
      const featured = (events || []).find(e => hasLiveTv(e.live_tv));
      const existing = document.getElementById('listFeaturedLiveTv');
      if (existing) existing.remove();
      if (!featured || listTab !== 'live') return;
      const tv = featured.live_tv;
      const pb = window.GunduLiveTv && GunduLiveTv.tvPlayback
        ? GunduLiveTv.tvPlayback(tv)
        : { mode: tv.embed_url ? 'embed' : 'none', embed: tv.embed_url || '' };
      const panel = document.createElement('section');
      panel.id = 'listFeaturedLiveTv';
      panel.className = 'live-tv-panel';
      const tabs = app.querySelector('.tabs');
      if (tabs) tabs.insertAdjacentElement('afterend', panel);
      else app.prepend(panel);
      panel.innerHTML = `<div class="live-tv-head">📺 LIVE TV · ${esc(featured.match_name || 'Live match')}</div><div id="listFeaturedLiveTvBody"></div>`;
      const body = document.getElementById('listFeaturedLiveTvBody');
      if (window.GunduLiveTv && GunduLiveTv.mountPlayer && body) {
        listFeaturedTvPlayer = GunduLiveTv.mountPlayer(body, tv, {
          videoId: 'listFeaturedLiveTvVideo',
          muteId: 'listFeaturedLiveTvMute',
        });
      } else if (pb.mode === 'embed' && body) {
        body.innerHTML = `<iframe class="live-tv-frame" src="${esc(pb.embed)}" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
      } else if (body) {
        body.innerHTML = `<div class="live-tv-msg">Stream starting soon…</div>`;
      }
    }

    function setBottomNavVisible(show) {
      document.body.classList.toggle('no-bottom-nav', !show);
    }

    async function renderList() {
      setBottomNavVisible(true);
      backBtn.style.display = 'none';
      stopListFeaturedTv();
      app.innerHTML = `
        <div class="tabs">
          <button class="${listTab === 'live' ? 'active' : ''}" data-tab="live"><span class="dot"></span>Live</button>
          <button class="${listTab === 'pre' ? 'active' : ''}" data-tab="pre">Pre Events</button>
        </div>
        <div class="loading">Loading matches…</div>`;
      app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
        listTab = b.dataset.tab;
        setQuery({ view: '', event_id: '', pre: listTab === 'pre' ? '1' : '' });
        renderList();
      });

      try {
        const url = listTab === 'live' ? '/api/cricket/live-events/' : '/api/cricket/pre-events/';
        const data = await getJson(url);
        let events = data.events || [];
        if (listTab === 'live') {
          events = await enrichEventsLiveTv(events);
          events = sortLiveTvFirst(events, e => hasLiveTv(e.live_tv));
        }
        if (!events.length) {
          app.querySelector('.loading').outerHTML = `<div class="empty">${listTab === 'live' ? 'No live matches right now.' : 'No pre-match events available.'}</div>`;
          return;
        }
        const html = events.map(e => {
          const status = (e.clock_status || '').toUpperCase();
          const badge = status === 'STARTED' ? '<span class="badge">LIVE</span>'
            : status === 'NOT_STARTED' || !status ? '<span class="badge up">UPCOMING</span>'
            : `<span class="badge up">${esc(status)}</span>`;
          const odds = (e.match_odds || []).map(o => ({ name: o.team, price_format: o.price_format }));
          const tvMark = hasLiveTv(e.live_tv) ? tvBadgeHtml() : '';
          return `<article class="match-card" data-id="${e.event_id}">
            <h3>${esc(e.match_name)} ${badge}${tvMark}</h3>
            <div class="meta">${esc(e.competition || e.current_innings || (listTab === 'pre' ? 'Upcoming' : ''))}</div>
            ${oddButtons(odds)}
          </article>`;
        }).join('');
        app.querySelector('.loading').outerHTML = html;
        // Live video disabled on cricket list — matches/odds only
        stopListFeaturedTv();
        const oldTv = document.getElementById('listFeaturedLiveTv');
        if (oldTv) oldTv.remove();
        app.querySelectorAll('.match-card').forEach(card => {
          card.onclick = () => {
            const id = card.dataset.id;
            const ev = events.find(e => String(e.event_id) === String(id));
            setQuery(matchDetailQuery(id, ev && ev.live_tv, listTab === 'pre'));
            renderMatch(id, listTab === 'pre');
          };
        });
        app.querySelectorAll('.odd-btn').forEach(btn => {
          btn.onclick = (ev) => {
            ev.stopPropagation();
            toast(`${btn.dataset.name} @ ${btn.dataset.price}`);
          };
        });
      } catch (err) {
        app.querySelector('.loading').outerHTML = `<div class="error">${esc(err.message)}. <a href="javascript:location.reload()">Retry</a></div>`;
      }
    }

    async function renderMatch(eventId, isPre) {
      setBottomNavVisible(false);
      backBtn.style.display = 'block';
      app.innerHTML = `<div class="loading">Loading markets…</div>`;
      if (pollTimer) clearInterval(pollTimer);
      stopLiveTv();
      showLiveTv = false;
      liveTvUserDismissed = true;
      let lastDetail = null;

      const p = qs();
      const radheEventId = p.get('radhe_event_id') || p.get('radhe_id') || radheEventIdFromQuery();
      let liveTvInfo = null;
      let liveTvAvailable = false;
      if (radheEventId && !isPre) {
        liveTvInfo = liveTvFromApi({ live_tv: { radhe_event_id: radheEventId } });
        liveTvAvailable = hasLiveTvInfo(liveTvInfo);
      } else if (p.get('has_tv') === '1' && !isPre) {
        // TV available but closed by default — user can open with 📺 button
      }

      async function resolveLiveTv(d) {
        if (liveTvInfo && hasLiveTvInfo(liveTvInfo)) return liveTvInfo;
        const cached = liveTvFromApi(d);
        if (cached) return cached;
        if (radheEventId) {
          try {
            const data = await getJson(`/api/sports/live-tv/lookup/?radhe_event_id=${encodeURIComponent(radheEventId)}`);
            if (hasLiveTvInfo(data)) return { ...data, ok: true };
          } catch (_) {}
        }
        try {
          const hit = await loadLiveTv(d.match_name, d.competition, teamNamesFromDetail(d));
          if (hasLiveTvInfo(hit)) return { ...hit, ok: true };
          return { ok: false };
        } catch (_) {
          return { ok: false };
        }
      }

      async function load({ fromPoll = false } = {}) {
        const liveUrl = `/api/cricket/live-odds/?event_id=${eventId}`;
        const preUrl = `/api/cricket/preevent-odds/?event_id=${eventId}`;
        let url = isPre ? preUrl : liveUrl;
        const prefetch = window.GunduLiveTv ? GunduLiveTv.fetchIndex(false).catch(() => null) : null;
        let d;
        try {
          [d] = await Promise.all([getJson(url), prefetch]);
        } catch (err) {
          // Live gap: try the other endpoint once before failing the screen.
          if (!fromPoll && !isPre && /Failed \(404\)/.test(err.message || '')) {
            try {
              d = await getJson(preUrl);
              isPre = true;
            } catch (_) {
              throw err;
            }
          } else if (fromPoll && lastDetail) {
            toast('Odds updating…');
            return;
          } else {
            throw err;
          }
        }

        if (d && d.status === 'UNAVAILABLE') {
          if (fromPoll && lastDetail) {
            const el = document.querySelector('.updated');
            if (el) el.textContent = 'Match finished or odds paused';
            return;
          }
          app.innerHTML = `<div class="empty">This match is no longer available for betting.
            <div style="margin-top:12px"><a href="javascript:history.back()" style="color:var(--gold)">Go back</a></div></div>`;
          return;
        }

        lastDetail = d;
        if (!isPre) {
          const tv = await resolveLiveTv(d);
          liveTvInfo = hasLiveTvInfo(tv) ? tv : null;
          liveTvAvailable = !!liveTvInfo;
        } else {
          liveTvInfo = null;
          liveTvAvailable = false;
        }
        if (fromPoll && isLiveTvPlaying()) {
          updateScoresOnly(d);
          if (window.GunduBetslip) {
            await GunduBetslip.loadOpenBets({ betsUrl: '/api/cricket/bets/', eventId: d.event_id });
            refreshMarketBetTags(d);
          }
          return;
        }
        if (window.GunduBetslip) {
          await GunduBetslip.loadOpenBets({ betsUrl: '/api/cricket/bets/', eventId: d.event_id });
        }
        app.dataset.betsUrl = '/api/cricket/bets/';
        app.dataset.eventId = String(d.event_id || eventId);
        const markets = d.all_markets || [];
        const main = filterMarkets(markets, 'main');
        const over = filterMarkets(markets, 'over');
        const special = filterMarkets(markets, 'special');
        const filtered = filterMarkets(markets, filter);
        const crumb = (() => {
          if (isPre && d.competition) return `Cricket > ${d.competition} > Upcoming`;
          if (d.current_innings) return `Cricket > ${d.current_innings}`;
          if (d.competition) return `Cricket > ${d.competition}`;
          return 'Cricket';
        })();
        const scores = d.scores || [];
        const scoreHtml = scores.length ? `
          <div class="score-card" id="scoreboard" style="${showScoreboard ? '' : 'display:none'}">
            <div class="score-head">Cricket</div>
            <div class="score-body">
              ${scores.map(s => `
                <div class="score-row">
                  <img class="team-logo" src="${esc(teamLogoUrl(s.team))}" alt="${esc(teamAbbr(s.team))}" loading="lazy" />
                  <span class="abbr">${esc(teamAbbr(s.team))}</span>
                  ${s.batting ? '<span class="bat-dot"></span>' : ''}
                  <span class="score">${esc(s.score || '0-0')}</span>
                </div>`).join('')}
              <div class="score-foot">${esc(d.current_innings || '')}</div>
            </div>
          </div>` : '';

        const tvPb = liveTvInfo && window.GunduLiveTv && GunduLiveTv.tvPlayback
          ? GunduLiveTv.tvPlayback(liveTvInfo)
          : { mode: liveTvInfo && liveTvInfo.embed_url ? 'embed' : 'none', embed: liveTvInfo && liveTvInfo.embed_url || '', relayHls: '' };
        if (!liveTvAvailable) {
          showLiveTv = false;
        }
        // Live video stays closed unless user taps 📺
        const tvBtnHtml = liveTvAvailable
          ? `<button class="icon-btn ${showLiveTv ? 'on' : ''}" id="tvBtn" title="Live TV">📺</button>`
          : '';
        const liveTvHtml = `
          <div class="live-tv-panel" id="liveTvPanel" style="${showLiveTv && hasLiveTvInfo(liveTvInfo) ? '' : 'display:none'}">
            <div id="liveTvPanelBody"></div>
          </div>`;

        app.innerHTML = `
          <div class="crumb">${esc(crumb)}</div>
          <h1 class="title">${esc(d.match_name || 'Match')}</h1>
          <div class="actions">
            ${tvBtnHtml}
            <button class="pill ${showScoreboard ? 'on' : ''}" id="scoreBtn">Scoreboard</button>
          </div>
          ${liveTvHtml}
          ${scoreHtml}
          <div class="section-title">Markets & Odds</div>
          <div class="filters">
            <button class="chip ${filter==='main'?'active':''}" data-f="main">Main (${main.length})</button>
            <button class="chip ${filter==='all'?'active':''}" data-f="all">All (${markets.length})</button>
            <button class="chip ${filter==='over'?'active':''}" data-f="over">Over by over (${over.length})</button>
            <button class="chip ${filter==='special'?'active':''}" data-f="special">Special (${special.length})</button>
          </div>
          <div class="updated">${d.last_sync || d.updated ? 'Updated ' + esc(d.last_sync || d.updated) : ''}</div>
          <div id="markets">
            ${filtered.length ? filtered.map(m => {
              const sub = [m.period, m.market_type || m.market_name].filter(Boolean).join(' · ');
              const head = window.GunduBetslip
                ? GunduBetslip.marketHeadHtml(m.market_name, m.market_id, m.outcomes || [])
                : `<h4>${esc(m.market_name)}</h4>`;
              return `<article class="market-card" data-market-id="${esc(m.market_id)}">
                ${head}
                <div class="sub">${esc(sub)}</div>
                ${oddButtons(m.outcomes || [], {
                  eventId: d.event_id,
                  eventName: d.match_name,
                  marketId: m.market_id,
                  marketName: m.market_name,
                })}
              </article>`;
            }).join('') : '<div class="empty">No markets in this filter.</div>'}
          </div>`;

        const tvBtn = document.getElementById('tvBtn');
        if (tvBtn) {
          tvBtn.onclick = async () => {
            showLiveTv = !showLiveTv;
            liveTvUserDismissed = !showLiveTv;
            if (showLiveTv && !hasLiveTvInfo(liveTvInfo)) {
              try {
                liveTvInfo = await resolveLiveTv(d);
                liveTvAvailable = hasLiveTvInfo(liveTvInfo);
                if (!liveTvAvailable) throw new Error('No stream');
              } catch (e) {
                toast(e.message || 'Could not load live TV');
                showLiveTv = false;
                liveTvUserDismissed = true;
                return;
              }
            }
            const panel = document.getElementById('liveTvPanel');
            const panelBody = document.getElementById('liveTvPanelBody');
            tvBtn.classList.toggle('on', showLiveTv);
            if (!panel) return;
            if (!showLiveTv) {
              stopLiveTv();
              if (panelBody) panelBody.innerHTML = '';
              panel.style.display = 'none';
              return;
            }
            panel.style.display = '';
            if (panelBody && window.GunduLiveTv && GunduLiveTv.mountPlayer) {
              stopLiveTv();
              liveTvPlayer = GunduLiveTv.mountPlayer(panelBody, liveTvInfo);
            } else if (panelBody) {
              const pb = GunduLiveTv && GunduLiveTv.tvPlayback
                ? GunduLiveTv.tvPlayback(liveTvInfo)
                : { mode: liveTvInfo.embed_url ? 'embed' : 'none', embed: liveTvInfo.embed_url || '' };
              if (pb.mode === 'embed') {
                panelBody.innerHTML = `<iframe class="live-tv-frame" id="liveTvFrame" src="${esc(pb.embed)}" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
              }
            }
          };
        }
        document.getElementById('scoreBtn').onclick = () => {
          showScoreboard = !showScoreboard;
          const el = document.getElementById('scoreboard');
          const btn = document.getElementById('scoreBtn');
          if (el) el.style.display = showScoreboard ? '' : 'none';
          btn.classList.toggle('on', showScoreboard);
        };
        app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
          filter = c.dataset.f;
          load({ fromPoll: true }).catch(e => toast(e.message || 'Could not refresh'));
        });
        if (window.GunduBetslip) {
          GunduBetslip.bindOddButtons(app, {
            sport: 'cricket',
            eventId: d.event_id,
            eventName: d.match_name,
            betUrl: '/api/cricket/bet/',
            betsUrl: '/api/cricket/bets/',
          });
        }

        if (showLiveTv && hasLiveTvInfo(liveTvInfo)) {
          const panelBody = document.getElementById('liveTvPanelBody');
          if (panelBody && window.GunduLiveTv && GunduLiveTv.mountPlayer) {
            stopLiveTv();
            liveTvPlayer = GunduLiveTv.mountPlayer(panelBody, liveTvInfo);
          } else if (panelBody && tvPb.mode === 'embed') {
            panelBody.innerHTML = `<iframe class="live-tv-frame" id="liveTvFrame" src="${esc(tvPb.embed)}" allow="autoplay; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>`;
          }
        }
      }

      try {
        await load();
        window.addEventListener('gundu:bets-changed', () => load({ fromPoll: true }).catch(() => {}));
        const interval = isPre ? 30000 : 8000;
        pollTimer = setInterval(() => load({ fromPoll: true }).catch(() => {}), interval);
      } catch (err) {
        const msg = /Failed \(404\)/.test(err.message || '')
          ? 'Match finished or odds temporarily unavailable'
          : (err.message || 'Could not load match');
        app.innerHTML = `<div class="error">${esc(msg)}. <a href="javascript:location.reload()">Retry</a>
          <div style="margin-top:10px"><a href="javascript:history.back()" style="color:var(--gold)">Back</a></div></div>`;
      }
    }

    backBtn.onclick = () => {
      if (pollTimer) clearInterval(pollTimer);
      stopLiveTv();
      showLiveTv = false;
      setQuery({ view: '', event_id: '' });
      renderList();
    };
    document.getElementById('myBets').onclick = () => {
      if (window.GunduBetslip) GunduBetslip.showMyBets({ betsUrl: '/api/cricket/bets/' });
      else toast('My bets');
    };
    document.getElementById('plusBtn').onclick = () => toast('Open wallet in app');

    function boot() {
      const p = qs();
      const eventId = p.get('event_id');
      const view = p.get('view');
      const pre = p.get('pre');
      if (pre === '0') listTab = 'live';
      else if (pre === '1') listTab = 'pre';
      if ((view === 'match' || eventId) && eventId) {
        renderMatch(eventId, pre !== '0' && (pre === '1' || listTab === 'pre'));
      } else {
        renderList();
      }
    }
    window.addEventListener('popstate', boot);
    boot();
  </script>
</body>
</html>
